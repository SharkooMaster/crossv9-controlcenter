name: Build and Push ControlCenter

# This workflow lives at the root of the standalone `crossv9-controlcenter` repo,
# i.e. `controlcenter/` from the monorepo IS the repo root. All paths are therefore
# relative to that root. Mirrors the cross / benchrunner per-service workflows.

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push controlcenter image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/crossv9-controlcenter:latest
            ghcr.io/${{ steps.owner.outputs.value }}/crossv9-controlcenter:${{ github.sha }}
